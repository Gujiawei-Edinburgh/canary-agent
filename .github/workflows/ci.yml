name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check workspace
        run: cargo check --workspace
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Run non-sandbox tests
        run: cargo test --workspace -- --skip 'sandbox::linux::tests::'

  linux-sandbox:
    needs: rust
    runs-on: ubuntu-latest
    container:
      image: rust:1-bookworm
      options: --privileged
    steps:
      - name: Install checkout dependencies
        run: apt-get update && apt-get install --yes git
      - uses: actions/checkout@v4
      - name: Run Linux sandbox tests
        run: cargo test -p lite-agent-tools 'sandbox::linux::tests::' --lib -- --nocapture

  desktop:
    name: Desktop ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Intel
            os: macos-13
            args: --target x86_64-apple-darwin
            target: x86_64-apple-darwin
            artifact: lite-agent-macos-intel
          - name: macOS Apple Silicon
            os: macos-14
            args: --target aarch64-apple-darwin
            target: aarch64-apple-darwin
            artifact: lite-agent-macos-arm
          - name: Windows x64
            os: windows-latest
            args: --target x86_64-pc-windows-msvc
            target: x86_64-pc-windows-msvc
            artifact: lite-agent-windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install frontend dependencies
        working-directory: lite-agent-desktop
        run: npm ci
      - name: Build desktop bundle
        working-directory: lite-agent-desktop
        run: npm run tauri build -- ${{ matrix.args }}
        env:
          LITE_AGENT_DDG_API_KEY: ${{ secrets.LITE_AGENT_DDG_API_KEY }}
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            lite-agent-desktop/src-tauri/target/**/release/bundle/**/*.dmg
            lite-agent-desktop/src-tauri/target/**/release/bundle/**/*.exe
