[package]
name = "canary-agent-openai"
version = "0.1.0"
edition = "2021"

[dependencies]
canary-agent-kernel = { path = "../canary-agent-kernel" }
canary-agent-runtime = { path = "../canary-agent-runtime" }
futures-util = "0.3"
reqwest = { version = "0.13", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
