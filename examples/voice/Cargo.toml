[package]
name = "voice"
version = "0.1.0"
edition = "2024"
default-run = "voice"

[dependencies]
canary-agent-runtime = { path = "../../canary-agent-runtime" }
canary-agent-openai = { path = "../../canary-agent-openai" }
canary-agent-kernel = { path = "../../canary-agent-kernel" }
canary-agent-store-json = { path = "../../canary-agent-store-json" }
canary-agent-observability = { path = "../../canary-agent-observability" }
canary-agent-tools = { path = "../../canary-agent-tools" }
cpal = "0.16"
rubato = "0.16"
sonora = "0.2"
dotenvy = "0.15"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
base64 = "0.22"
url = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "process", "io-util", "time"] }
